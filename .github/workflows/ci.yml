name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: Engine and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Direct tests (engine + structural tests on the built contract)
        run: python -m pytest tests/direct
      - name: Mutation check - every guard must be killable
        run: python tests/mutation_check.py
      - name: Committed contracts match their sources
        # The deployed bytes are contracts/build/*.min.py (the app bundles the
        # guard). If any build is stale, a deploy would ship code the tests
        # never saw.
        run: python deploy/build_contract.py && git diff --exit-code contracts/build/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Parity with the engine (enums and mandate validator)
        run: npm run parity
      - name: Build
        run: npm run build
